<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root {
      --bg: #006a60;
      --fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #53dbca;
        --fg: #003731;
      }
    }
    .bg { fill: var(--bg); }
    .fg { fill: var(--fg); }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <rect class="fg" x="5" y="5" width="5" height="22" rx="1.5" />
  <rect class="fg" x="22" y="5" width="5" height="22" rx="1.5" />
  <polygon class="fg" points="10,13 22,15 22,19 10,17" />
</svg>

